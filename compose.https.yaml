services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configura APP_DOMAIN con tu dominio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      campo:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
